<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <div id="slot-top"></div>

    <div id="status-container">
        <div id="status-tag"></div>
    </div>

    <div id="bg-container"></div>
    
    <canvas id="weather-canvas"></canvas>
    <div id="flash-overlay"></div>

    <div class="header">
        <div class="time-area glass-box">
            <div id="time">00:00</div>
            <div id="date">--</div>
        </div>
        <div class="weather-now glass-box">
            <div class="temp-row">
                <span id="main-icon">☀️</span>
                <span id="temp-big">--ºC</span>
            </div>
            <div id="weather-status">--</div>
        </div>
    </div>

    <div class="forecast-area">
        <div class="loc-label">CABANILLAS DEL CAMPO</div>
        <div id="forecast-box" style="display:flex;"></div>
    </div>

    <div id="gallery-info-box" class="glass-box">
        <div class="ip-row">IP: <span id="ip-address">--</span></div>
        <div class="count-row" id="gallery-count">0 / 0</div>
        <div class="name-row" id="file-name">--</div>
    </div>

    <div class="footer-bar"></div>

   <!-- 1. CONFIGURACIÓN Y DATOS BASE -->
    <script src="./js/config.js"></script>
    <script src="./fotos/galeria.js"></script>

    <!-- 2. LÓGICA DE COMPONENTES (Cargar antes de MainContent) -->
    <script src="js/forecast.js"></script> <!-- IMPORTANTE: Añade esta línea si el archivo existe -->
    <script src="js/bottom_banner.js"></script>
    <script src="js/gallery.js"></script>
    <script src="js/network.js"></script>
    
    <!-- 3. EFECTOS (Necesarios para que MainContent no de error al llamar a setEffect) -->
    <script src="js/effects/particles.js"></script>
    <script src="js/effects/sun.js"></script>
    <script src="js/effects/storm.js"></script>
    <script src="js/effects/clouds.js"></script>
    <script src="js/effects/little_rain.js"></script>
    <script src="js/effects/rain.js"></script>
    <script src="js/effects/hail.js"></script>
    <script src="js/effects/night.js"></script>
    <script src="js/effects/snow.js"></script>
    <script src="js/effects/fog.js"></script>
    <script src="js/weather_effects.js"></script>

    <!-- 4. LÓGICA PRINCIPAL (Al final de los componentes) -->
    <script src="js/main_content.js"></script>
    
    <!-- 5. CARGADORES DE MEDIA -->
    <script src="js/playlist.js"></script>
    <script src="js/media_loader.js"></script>

    <!-- 6. INICIALIZADOR ÚNICO -->
    <script>
        window.onload = () => {
            console.log("Iniciando Sistema...");
            
            // Iniciamos los efectos primero
            if(typeof WeatherEffects !== 'undefined') {
                WeatherEffects.init('weather-canvas');
            }

            // MainContent ya lleva dentro el reloj y la carga de datos
            if(typeof MainContent !== 'undefined') {
                MainContent.init();
            }

            // Lógica de visibilidad de Banners
            const topBar = document.querySelector('.news-banner');
            if (topBar && !CONFIG.showTopBanner) {
                topBar.classList.add('hidden');
            }

            const bottomBar = document.querySelector('.footer-bar');
            if (bottomBar && !CONFIG.showBottomBanner) {
                bottomBar.classList.add('hidden');
            }else{
                if(typeof BottomBanner !== 'undefined') BottomBanner.init();
            }

            if(typeof Gallery !== 'undefined') Gallery.init();
        };
    </script>
    
</body>
</html>
