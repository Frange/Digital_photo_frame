<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <div id="status-container">
        <div id="status-tag"></div>
    </div>

    <div id="bg-container">
        <div id="bg-data" style="position: absolute; width: 100%; height: 100%; background-size: cover; background-position: center; transition: opacity 0.6s;"></div>
    </div>
    
    <canvas id="weather-canvas"></canvas>

    <div class="header">
        <div class="time-area glass-box box-reloj">
            <div id="time">00:00</div>
            <div id="date">--</div>
        </div>
        <div class="weather-now glass-box box-clima">
            <div class="temp-row">
                <span id="main-icon">☀️</span>
                <span id="temp-big">--ºC</span>
            </div>
            <div id="weather-status">--</div>
        </div>
    </div>

    <div id="hourly-box" class="glass-box">
        <div id="hourly-container"></div>
    </div>

    <div id="hourly-announcer" class="announcer-hidden">
        <div class="bubble">
            <span id="announcer-text">¡Son las 12 en punto!</span>
        </div>
        <img id="announcer-img" src="" alt="Personaje">
    </div>

    <script src="./js/config.js"></script>
    <script src="./fotos/galeria.js"></script>
    <script src="js/forecast.js"></script>
    <script src="js/gallery.js"></script>
    <script src="js/weather.js"></script>
    
    <script src="js/effects/particles.js"></script> 
    <script src="js/effects/clouds.js"></script>
    <script src="js/effects/rain.js"></script>
    <script src="js/effects/hail.js"></script>
    <script src="js/effects/snow.js"></script>
    <script src="js/effects/storm.js"></script>
    <script src="js/effects/fog.js"></script>
    <script src="js/effects/sun.js"></script>
    <script src="js/weather_effects.js"></script>
    
    <script src="./js/frases.js"></script>
    <script src="js/announcer_inventory.js"></script>
    <script src="js/main_content.js"></script>

    </body>
</html>
