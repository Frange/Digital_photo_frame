<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <div id="status-container">
        <div id="status-tag"></div>
    </div>

    <div id="bg-container"></div>
    <canvas id="weather-canvas"></canvas>

    <!-- CABECERA: RELOJ Y CLIMA ACTUAL -->
    <div class="header">
        <div class="time-area glass-box box-reloj">
            <div id="time">00:00</div>
            <div id="date">--</div>
        </div>
        <div class="weather-now glass-box box-clima">
            <div class="temp-row">
                <span id="main-icon">☀️</span>
                <span id="temp-big">--ºC</span>
            </div>
            <div id="weather-status">--</div>
        </div>
    </div>

    <!-- ABAJO DERECHA: NUEVO RECUADRO DE HORAS -->
    <div id="hourly-box" class="glass-box">
        <div id="hourly-container"></div>
    </div>

    <div id="hourly-announcer" class="announcer-hidden">
        <div class="bubble">
            <span id="announcer-text">¡Son las 12 en punto!</span>
        </div>
        <img id="announcer-img" src="" alt="Personaje">
    </div>

    <!-- SCRIPTS -->
    <script src="./js/config.js"></script>
    <script src="./fotos/galeria.js"></script>
    <script src="js/forecast.js"></script>
    <script src="js/gallery.js"></script>
    <script src="js/weather_effects.js"></script>
    <script src="./js/frases.js"></script>
    <script src="js/announcer_inventory.js"></script>
    <script src="js/main_content.js"></script>
    <script src="js/media_loader.js"></script>

    <script>
        window.onload = () => {
            if(typeof WeatherEffects !== 'undefined') WeatherEffects.init('weather-canvas');
            if(typeof MainContent !== 'undefined') MainContent.init();
            if(typeof Gallery !== 'undefined') Gallery.init();
        };
    </script>
</body>
</html>
