<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>iPad Dashboard Pro v52 - Final Fix</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { height: 100%; width: 100%; background: #000; color: white; font-family: 'Segoe UI', sans-serif; overflow: hidden; }

        #bg-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        #bg-main { width: 100%; height: 100%; object-fit: cover; opacity: 0.6; }
        #weather-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
        #flash-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 11; background: white; opacity: 0; pointer-events: none; }
        
        /* NOTICIAS RESTAURADAS */
        .news-banner { position: absolute; top: 0; width: 100%; background: rgba(0,0,0,0.9); height: 35px; z-index: 100; border-bottom: 1px solid #222; display: flex; align-items: center; padding: 0 15px; }
        .news-source { color: #ffcc00; font-weight: 900; border-right: 1px solid #333; padding-right: 12px; margin-right: 12px; font-size: 0.75rem; flex-shrink: 0; }
        #news-text { font-size: 0.85rem; color: #ccc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }

        .glass-box { background: rgba(0,0,0,0.65); border-radius: 18px; backdrop-filter: blur(25px); border: 1px solid rgba(255,255,255,0.1); }
        .header { position: absolute; top: 50px; width: 100%; padding: 0 25px; display: flex; justify-content: space-between; align-items: flex-start; z-index: 20; }
        
        .time-area { padding: 25px 35px; text-align: left; }
        #time { font-size: 5.5rem; font-weight: 700; line-height: 0.8; letter-spacing: -2px; }
        #date { font-size: 1.2rem; margin-top: 12px; display: block; text-transform: capitalize; opacity: 0.8; }

        /* AJUSTE ANCHURA TEMPERATURA */
        .weather-now { text-align: right; padding: 20px 25px; min-width: 220px; } /* Reducido de 320px */
        .temp-row { display: flex; align-items: center; justify-content: flex-end; gap: 10px; }
        #main-icon { font-size: 3.5rem; }
        #temp-big { font-size: 5rem; font-weight: 200; line-height: 0.8; }
        #weather-status { color: #ffcc00; font-weight: 800; text-transform: uppercase; margin-top: 12px; font-size: 0.75rem; letter-spacing: 1px; }

        .forecast-area { position: absolute; bottom: 65px; left: 25px; z-index: 20; }
        .loc-label { background: rgba(0,0,0,0.7); display: inline-block; padding: 5px 15px; border-radius: 10px; font-size: 0.8rem; font-weight: 900; margin-bottom: 10px; border: 1px solid #333; }
        .f-day { width: 95px; text-align: center; background: rgba(15, 15, 15, 0.9); padding: 15px 5px; border-radius: 15px; border: 1px solid #333; margin-right: 10px; display: inline-block; }
        .f-name { font-size: 0.8rem; color: #ffcc00; font-weight: 900; display: block; margin-bottom: 8px; }
        .f-icon { font-size: 1.8rem; margin-bottom: 8px; display: block; }

        /* FOOTER RESTAURADO */
        .footer-bar { position: absolute; bottom: 0; width: 100%; background: #000; height: 45px; display: flex; justify-content: space-between; align-items: center; padding: 0 25px; z-index: 30; border-top: 1px solid #222; font-size: 0.8rem; text-transform: uppercase; font-weight: bold; }
        
        #demo-label { position: absolute; top: 35px; left: 50%; transform: translateX(-50%); z-index: 1000; background: #ffcc00; color: #000; padding: 2px 12px; font-weight: 900; font-size: 0.6rem; border-radius: 0 0 8px 8px; }
    </style>
</head>
<body>

    <div id="demo-label">ESTADO: <span id="demo-state">CARGANDO</span></div>
    <div id="bg-container"><img id="bg-main" src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1200&q=80"></div>
    <canvas id="weather-canvas"></canvas>
    <div id="flash-overlay"></div>

    <div class="news-banner">
        <div class="news-source">EL MUNDO</div>
        <div id="news-text">Sincronizando últimas noticias y alertas meteorológicas...</div>
    </div>

    <div class="header">
        <div class="time-area glass-box">
            <div id="time">00:00</div>
            <div id="date">--</div>
        </div>
        <div class="weather-now glass-box">
            <div class="temp-row">
                <span id="main-icon">☀️</span>
                <span id="temp-big">--ºC</span>
            </div>
            <div id="weather-status">--</div>
        </div>
    </div>

    <div class="forecast-area">
        <div class="loc-label">CABANILLAS DEL CAMPO</div>
        <div id="forecast-box" style="display:flex;"></div>
    </div>

    <div class="footer-bar">
        <div id="rain-info">CABANILLAS: ANALIZANDO DATOS...</div>
        <div id="temp-torrevieja">TORREVIEJA: --ºC | CARGANDO</div>
    </div>

    <script>
        const canvas = document.getElementById('weather-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [], stars = [], lightning = null, shootingStar = null, demoIdx = 0;

        const modes = [
            'Día: Sol', 'Día: Sol con nubes', 'Día: Lluvia', 'Día: Tormenta y Lluvia', 'Día: Niebla', 'Día: Nieve', 'Día: Viento fuerte',
            'Noche: Limpio', 'Noche: Nubes', 'Noche: Lluvia', 'Noche: Lluvia y Tormenta', 'Noche: Niebla', 'Noche: Nieve', 'Noche: Viento fuerte'
        ];

        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; initStars(); }
        window.addEventListener('resize', resize);
        resize();

        function initStars() {
            stars = [];
            for(let i=0; i<150; i++) {
                stars.push({x: Math.random()*canvas.width, y: Math.random()*(canvas.height*0.6), s: Math.random()*1.8, o: Math.random()});
            }
        }

        class Particle {
            constructor(type) { this.type = type; this.reset(); }
            reset() {
                this.x = Math.random() * canvas.width;
                if(this.type === 'rain') { this.y = Math.random() * -canvas.height; this.speed = 25; this.len = 30; }
                else if(this.type === 'snow') { this.y = Math.random() * -canvas.height; this.speed = 2; this.r = 3; this.vx = Math.random()-0.5; }
                else if(this.type === 'cloud') { this.x = -500; this.y = Math.random()*canvas.height*0.4; this.r = 200 + Math.random()*100; this.speed = 0.8; }
                else if(this.type === 'wind') { this.x = -400; this.y = Math.random()*canvas.height; this.len = 300; this.speed = 45; }
                else if(this.type === 'fog') { this.x = Math.random()*canvas.width; this.y = Math.random()*canvas.height; this.r = 400; }
            }
            draw() {
                ctx.beginPath();
                if(this.type === 'rain') {
                    ctx.strokeStyle = "rgba(174,194,224,0.6)"; ctx.lineWidth = 1;
                    ctx.moveTo(this.x, this.y); ctx.lineTo(this.x, this.y+this.len); ctx.stroke();
                    this.y += this.speed;
                } else if(this.type === 'snow') {
                    ctx.fillStyle = "white"; ctx.arc(this.x, this.y, this.r, 0, Math.PI*2); ctx.fill();
                    this.y += this.speed; this.x += this.vx;
                } else if(this.type === 'cloud' || this.type === 'fog') {
                    let g = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.r);
                    g.addColorStop(0, this.type==='cloud' ? "rgba(255,255,255,0.15)" : "rgba(255,255,255,0.08)");
                    g.addColorStop(1, "transparent");
                    ctx.fillStyle = g; ctx.arc(this.x, this.y, this.r, 0, Math.PI*2); ctx.fill();
                    if(this.type === 'cloud') this.x += this.speed;
                } else if(this.type === 'wind') {
                    ctx.strokeStyle = "rgba(255,255,255,0.12)"; ctx.lineWidth = 2;
                    ctx.moveTo(this.x, this.y); ctx.lineTo(this.x+this.len, this.y); ctx.stroke();
                    this.x += this.speed;
                }
                if(this.y > canvas.height + 100 || this.x > canvas.width + 500) this.reset();
            }
        }

        function setEffect(m) {
            particles = []; 
            document.getElementById('demo-state').innerText = m.toUpperCase();
            if(m.includes('Lluvia') || m.includes('Tormenta')) for(let i=0; i<300; i++) particles.push(new Particle('rain'));
            if(m.includes('Nieve')) for(let i=0; i<150; i++) particles.push(new Particle('snow'));
            if(m.includes('nubes')) for(let i=0; i<60; i++) particles.push(new Particle('cloud'));
            if(m.includes('Niebla')) for(let i=0; i<80; i++) particles.push(new Particle('fog'));
            if(m.includes('viento')) for(let i=0; i<40; i++) particles.push(new Particle('wind'));
        }

        function drawLightning() {
            if(Math.random() > 0.98) {
                lightning = { x: Math.random()*canvas.width, y: 0, steps: [] };
                let lx = lightning.x, ly = 0;
                for(let i=0; i<12; i++) { lx += (Math.random()-0.5)*150; ly += canvas.height/12; lightning.steps.push({x: lx, y: ly}); }
                document.getElementById('flash-overlay').style.opacity = 0.5;
                setTimeout(()=> document.getElementById('flash-overlay').style.opacity = 0, 50);
            }
            if(lightning) {
                ctx.strokeStyle = "white"; ctx.lineWidth = 3; ctx.beginPath();
                ctx.moveTo(lightning.x, 0);
                lightning.steps.forEach(s => ctx.lineTo(s.x, s.y));
                ctx.stroke(); if(Math.random() > 0.7) lightning = null;
            }
        }

        function drawShootingStar() {
            if(!shootingStar && Math.random() > 0.998) { shootingStar = { x: Math.random()*canvas.width, y: Math.random()*canvas.height/2, len: 0 }; }
            if(shootingStar) {
                ctx.strokeStyle = "white"; ctx.beginPath(); ctx.moveTo(shootingStar.x, shootingStar.y);
                ctx.lineTo(shootingStar.x + shootingStar.len, shootingStar.y - shootingStar.len/2);
                ctx.stroke(); shootingStar.x -= 25; shootingStar.y += 12; shootingStar.len += 15;
                if(shootingStar.len > 300) shootingStar = null;
            }
        }

        function animate() {
            ctx.clearRect(0,0,canvas.width, canvas.height);
            const m = modes[demoIdx % modes.length];

            // MODO NOCHE: GRADIENTE INVERSO (Oscuro arriba -> Translúcido abajo)
            if(m.includes('Noche')) {
                let sky = ctx.createLinearGradient(0,0,0,canvas.height);
                sky.addColorStop(0, 'rgba(0,0,10,0.95)'); 
                sky.addColorStop(0.4, 'rgba(10,20,40,0.7)');
                sky.addColorStop(1, 'rgba(20,30,60,0.3)');
                ctx.fillStyle = sky; ctx.fillRect(0,0,canvas.width, canvas.height);
                
                stars.forEach(s => {
                    ctx.fillStyle = `rgba(255,255,255,${0.3 + Math.abs(Math.sin(Date.now()*0.001 + s.o))})`;
                    ctx.beginPath(); ctx.arc(s.x, s.y, s.s, 0, Math.PI*2); ctx.fill();
                });
                drawShootingStar();
                // Luna
                ctx.fillStyle = "rgba(255,255,240,0.9)"; ctx.beginPath(); ctx.arc(canvas.width-120, 150, 40, 0, Math.PI*2); ctx.fill();
            }

            if(m.includes('Sol')) {
                let sun = ctx.createRadialGradient(canvas.width*0.8, 80, 0, canvas.width*0.8, 80, 800);
                sun.addColorStop(0, "rgba(255,255,200,0.4)"); sun.addColorStop(1, "transparent");
                ctx.fillStyle = sun; ctx.fillRect(0,0,canvas.width, canvas.height);
            }

            if(m.includes('Tormenta')) drawLightning();
            particles.forEach(p => p.draw());
            requestAnimationFrame(animate);
        }

        async function updateData() {
            try {
                const rCab = await fetch(`https://wttr.in/Cabanillas+del+Campo?format=j1&lang=es`).then(res => res.json());
                const rTor = await fetch(`https://wttr.in/Torrevieja?format=j1&lang=es`).then(res => res.json());
                const cur = rCab.current_condition[0];
                document.getElementById('temp-big').innerText = cur.temp_C + "ºC";
                document.getElementById('weather-status').innerText = cur.lang_es[0].value;
                document.getElementById('forecast-box').innerHTML = rCab.weather.slice(0, 5).map(day => `
                    <div class="f-day">
                        <span class="f-name">${new Date(day.date).toLocaleDateString('es-ES', {weekday: 'short'}).toUpperCase()}</span>
                        <span class="f-icon">${getIcon(day.hourly[4].lang_es[0].value)}</span>
                        <b class="f-temp">${day.maxtempC}º/${day.mintempC}º</b>
                    </div>
                `).join('');
                document.getElementById('rain-info').innerText = `CABANILLAS: ${cur.lang_es[0].value.toUpperCase()} | HUMEDAD: ${cur.humidity}%`;
                document.getElementById('temp-torrevieja').innerText = `TORREVIEJA: ${rTor.current_condition[0].temp_C}ºC | ${rTor.current_condition[0].lang_es[0].value.toUpperCase()}`;
            } catch(e) {}
        }

        function getIcon(desc) {
            desc = desc.toLowerCase();
            if(desc.includes("lluvia")) return "🌧️";
            if(desc.includes("tormenta")) return "⚡";
            if(desc.includes("nieve")) return "❄️";
            if(desc.includes("nube")) return "⛅";
            return "☀️";
        }

        setInterval(() => {
            const d = new Date();
            document.getElementById('time').innerText = d.toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit'});
            document.getElementById('date').innerText = d.toLocaleDateString('es-ES', {weekday:'long', day:'numeric', month:'long'});
        }, 1000);

        window.onload = () => {
            updateData(); animate(); setEffect(modes[0]);
            setInterval(updateData, 60000);
            setInterval(() => { demoIdx++; setEffect(modes[demoIdx % modes.length]); }, 10000);
        };
    </script>
</body>
</html>
